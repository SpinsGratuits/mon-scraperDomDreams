name: Script Scraping Domino Dreams

on:
  schedule:
    # Exécution à la minute 30 toutes les 4 heures (00:30, 04:30, 08:30, etc.)
    - cron: '21 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les librairies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 cloudscraper firebase-admin

    - name: Lancer le scraper Domino Dreams
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
      run: python scraper.py

    - name: Sauvegarder les modifications dans le dépôt
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add scrapdominodreams.json
        git commit -m "Mise à jour automatique Domino Dreams : $(date +'%Y-%m-%d')" || exit 0
        git push
